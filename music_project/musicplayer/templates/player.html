{% extends "base.html" %}

{% block title %}Gesture Music Player{% endblock %}

{% block content %}
  <h1>🎵 Gesture Music Player 🎵</h1>
  <div id="music-player">
    <h2>Playlist</h2>
    <ul id="song-list">
      {% for entry in songs %}
      <li data-src="{{ entry.song.audio_file.url }}">
        <span>{{ entry.song.title }} - {{ entry.song.artist }}</span>
        <button class="play-button" onclick="playSong(this)">Play/Pause</button>
        <form action="{% url 'remove_from_my_music' entry.song.id %}" method="post" style="display:inline-block;">
          {% csrf_token %}
          <button type="submit" class="remove-button">Remove</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    <audio id="main-audio" controls autoplay></audio>
  </div>

  <script>
    const audio = document.getElementById('main-audio');

    function playSong(btn) {
        const li = btn.closest('li');
        const songSrc = li.getAttribute('data-src');
        if (audio.src !== window.location.origin + songSrc) {
            audio.src = songSrc;
            audio.play();
        } else {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    }

    audio.addEventListener('play', () => {
        document.querySelectorAll('#song-list li').forEach(li => li.classList.remove('playing'));
        const currentLi = Array.from(document.querySelectorAll('#song-list li'))
            .find(li => window.location.origin + li.getAttribute('data-src') === audio.src);
        if (currentLi) currentLi.classList.add('playing');
    });

    const socket = new WebSocket("ws://" + window.location.host + "/ws/gesture/");

    socket.onopen = function() {
        console.log("✅ [Frontend] WebSocket is open");
    };

    socket.onmessage = function(event) {
        console.log("📨 [Frontend] Raw message received:", event.data);
        const data = JSON.parse(event.data);
        const action = data.action;
        console.log("👂 [Frontend] Received gesture action:", action);
        if (action === "play") {
            audio.play();
        } else if (action === "pause") {
            audio.pause();
        } else if (action === "next") {
            const currentLi = document.querySelector('#song-list li.playing');
            const nextLi = currentLi?.nextElementSibling || document.querySelector('#song-list li');
            nextLi?.querySelector('button')?.click();
        } else if (action === "previous") {
            const currentLi = document.querySelector('#song-list li.playing');
            const prevLi = currentLi?.previousElementSibling || document.querySelector('#song-list li:last-child');
            prevLi?.querySelector('button')?.click();
        } else if (action === "volume_up") {
            audio.volume = Math.min(audio.volume + 0.1, 1);
        } else if (action === "volume_down") {
            audio.volume = Math.max(audio.volume - 0.1, 0);
        }
    };

    socket.onerror = function(error) {
        console.error("❗ [Frontend] WebSocket error:", error);
    };

    socket.onclose = function(event) {
        console.log("❌ [Frontend] WebSocket closed:", event);
    };
  </script>
{% endblock %}
