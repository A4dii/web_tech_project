{% extends 'base.html' %}
{% block content %}
<div class="upload-container">
    <h2 class="upload-heading">Upload Music</h2>
    <form method="post" enctype="multipart/form-data" class="upload-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="upload-button">Upload</button>
    </form>
</div>
{% endblock %}
